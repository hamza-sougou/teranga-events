name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_manager?schema=public
      JWT_SECRET: ci-test-secret
      FRONTEND_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=backend

      - name: Type-check
        run: npx tsc --noEmit --project backend/tsconfig.json

      - name: Apply migrations
        run: npm run prisma:migrate:deploy --workspace=backend

      - name: Unit tests
        run: npm test --workspace=backend

      - name: E2e tests (includes the anti-oversell and scan anti-fraud concurrency tests)
        run: npm run test:e2e --workspace=backend

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t zen-events-backend:ci .
